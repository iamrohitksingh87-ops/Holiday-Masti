<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Premium</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header class="header">
  <div class="logo">Holiday</div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Packages</a>
    <a href="#">Destinations</a>
    <a href="#">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Explore the World</h1>
    <p>Travel premium. Travel smart.</p>

    <div class="search-box">
      <input placeholder="Where to?">
      <input type="date">
      <button>Search</button>
    </div>
  </div>
</section>

<!-- CARDS -->
<section class="cards">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
    <h3>Goa</h3>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4">
    <h3>Bali</h3>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c">
    <h3>Dubai</h3>
  </div>

</section>

</body>
</html>
